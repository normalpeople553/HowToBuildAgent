[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-manual-mini-agent"
version = "0.1.0"
description = "A small, readable agent runtime for the Agent Manual tutorial"
requires-python = ">=3.10"
dependencies = [
  "openai==2.54.0",
]

[project.scripts]
mini-agent-demo = "mini_agent.demo:main"
mini-agent-multi = "mini_agent.multi_tool_demo:main"
mini-agent-deepseek = "mini_agent.real_deepseek:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
